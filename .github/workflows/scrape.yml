name: Scrape (GitHub Actions runner)

on:
  repository_dispatch:
    types: [run-scrape]
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: true
        type: string
      jobId:
        description: "Job ID (any string for manual runs)"
        required: false
        type: string
        default: "manual"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QUERY: ${{ github.event.client_payload.query || inputs.query }}
      JOB_ID: ${{ github.event.client_payload.jobId || inputs.jobId }}
      WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "$QUERY" ]; then
            echo "QUERY is empty"
            exit 1
          fi
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_URL or WEBHOOK_SECRET missing"
            exit 1
          fi
          echo "Job ID: $JOB_ID"
          echo "Query:  $QUERY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper-service/package-lock.json

      - name: Install scraper-service dependencies
        working-directory: scraper-service
        run: npm ci || npm install

      - name: Install Puppeteer Chrome (skipping Chromium download)
        working-directory: scraper-service
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -e
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome is not installed on the runner."
            exit 1
          fi
          google-chrome --version
          echo "PUPPETEER_EXECUTABLE_PATH=$PUPPETEER_EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Run scraper orchestrator
        id: scrape
        working-directory: scraper-service
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -e
          npx tsx src/scrape-runner.ts

      - name: Post results to webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ env.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ env.WEBHOOK_SECRET }}
          JOB_ID: ${{ env.JOB_ID }}
        run: |
          set -e
          if [ -f scraper-service/result.json ]; then
            BODY=$(cat scraper-service/result.json)
          else
            BODY="{\"jobId\":\"$JOB_ID\",\"error\":\"scraper_failed\"}"
          fi
          curl -fsS -o /dev/null -w "webhook_http=%{http_code}\n" \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY"
