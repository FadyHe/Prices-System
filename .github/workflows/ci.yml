name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper-service/package-lock.json

      - name: Install scraper-service dependencies
        working-directory: scraper-service
        run: npm ci || npm install

      - name: Type-check
        working-directory: scraper-service
        run: npx tsc --noEmit

      - name: Run scoring tests
        working-directory: scraper-service
        run: npm test
